name: babylon-school-frontend

services:
  babylon-school-frontend-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. Leave unset to use the app's default API base.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_CHATBOT_SCRIPT_URL: ${VITE_CHATBOT_SCRIPT_URL:-}
    image: babylon-public-school-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: babylon-school-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - babylon-public-school-network

networks:
  babylon-public-school-network:
    external: true
    name: babylon-public-school-network
